baseURL = 'https://akankshablog.pages.dev/' # Change to your own domain
copyright = "{year}"
locale = 'en-US'
defaultContentLanguage = 'en'
theme = 'lowkey'
title = 'Akanksha'
enableRobotsTXT = true
summaryLength = 15

[pagination]
  pagerSize = 5

# disqus is a comment system. see https://disqus.com
[services.disqus]
  shortname = ''

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = false
    noClasses = true
    noHl = false
    style = 'dracula'
    tabWidth = 4
